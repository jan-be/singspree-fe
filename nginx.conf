# Detect search engine / social preview bots by User-Agent.
# Bots get prerendered HTML (generated by singspree-be into the shared
# /prerendered volume); humans get the SPA.
map $http_user_agent $is_bot {
    default                     0;
    ~*googlebot                 1;
    # Googlebot Smartphone drops the googlebot token when it renders, so only
    # this 2015 device build gives the render pass away. Without it the render
    # phase gets the SPA shell while the crawl phase gets the prerendered page,
    # and Google indexes a different document than it crawled.
    "~*nexus 5x build/mmb29p"   1;
    ~*bingbot                   1;
    ~*slurp                     1;
    ~*duckduckbot               1;
    ~*baiduspider               1;
    ~*yandexbot                 1;
    ~*facebot                   1;
    ~*facebookexternalhit       1;
    ~*twitterbot                1;
    ~*linkedinbot               1;
    ~*whatsapp                  1;
    ~*telegrambot               1;
    ~*discordbot                1;
    ~*applebot                  1;
    ~*semrushbot                1;
    ~*ahrefsbot                 1;
    ~*mj12bot                   1;
    ~*dotbot                    1;
    ~*rogerbot                  1;
    ~*embedly                   1;
    ~*showyoubot                1;
    ~*outbrain                  1;
    ~*pinterest                 1;
    ~*slackbot                  1;
    ~*vkshare                   1;
    ~*w3c_validator             1;
    ~*petalbot                  1;
    ~*gptbot                    1;
    ~*claudebot                 1;
    ~*bytespider                1;
}

# singpro.app, the name until 2026-10-19: Traefik sends it here too. Crawlers
# get a 301 to the same page on singspree.com, so search engines move their
# index over. Browsers get public/moving.html, which carries their session
# and storage over (src/logic/moveIn.js) and then goes to the same page there;
# a file (a dot in the path) is still served, for pages still open there.
map $host $old_domain {
    default        0;
    singpro.app    1;
}
map "$old_domain:$is_bot" $old_domain_bot {
    default  0;
    "1:1"    1;
}
map "$old_domain:$is_bot:$uri" $old_domain_page {
    default            0;
    "~^1:0:/[^.]*$"    1;
}
# The canonical page of an old URL form (the legacy redirects below, folded
# into one), so a crawler on singpro.app reaches it in one 301 instead of two
# ("" for every URL that is canonical already)
map $uri $legacy_canonical {
    default                                                    "";
    "~^/(?:[a-z]{2}(?:-[A-Z]{2})?/)?sing/[^/]+/([^/]+)/?$"     /sing/$1;
    "~^/[a-z]{2}(?:-[A-Z]{2})?/sing/([^/]+)/?$"                /sing/$1;
    "~^/sing/([^/]+)/$"                                        /sing/$1;
    "~^/en/?$"                                                 /;
    "~^/(de|nl|ja|ko|es|pt|fr|it|tr|zh|zh-TW|th|id|pl|ru|ar|hi|vi|sv|tl)/$"   /$1;
    "~^/(?:en|de|nl|ja|ko|es|pt|fr|it|tr|zh|zh-TW|th|id|pl|ru|ar|hi|vi|sv|tl)(/.+)$"   $1;
    /index.html                                                /;
}

# The image's "main" format with the two headers of a conditional request at
# the end: whether a crawler's refetch could have been a 304 shows in the log
log_format with_conditional '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for" '
                            'ims="$http_if_modified_since" inm="$http_if_none_match"';

server {
    listen 80;
    root /files;
    access_log /var/log/nginx/access.log with_conditional;

    # A refetch of an unchanged page is a 304. nginx's default ("exact") wants
    # If-Modified-Since to be our Last-Modified to the second; a client that
    # sends the time it last fetched the page instead gets the whole page
    # again. Every file here changes only by being written anew (the backend's
    # generator, an image build), so its time only moves forward.
    if_modified_since before;

    # Traefik terminates TLS and proxies here over plain HTTP, so nginx builds
    # its absolute redirects with scheme http — every legacy URL then bounced
    # http://singspree.com/... -> Traefik's redirect-to-https -> https://..., two
    # hops through an insecure one for exactly the URLs search engines still
    # hold. Relative Location headers keep the scheme the client arrived with.
    absolute_redirect off;

    # singpro.app (see the maps above): one 301, straight to the canonical page
    set $moved_to $request_uri;
    if ($legacy_canonical) {
        set $moved_to $legacy_canonical$is_args$args;
    }
    if ($old_domain_bot) {
        return 301 https://singspree.com$moved_to;
    }
    if ($old_domain_page) {
        rewrite ^ /moving.html last;
    }
    location = /moving.html {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /moving.html =404;
    }
    # Passkeys made on singpro.app belong to that domain; this lets
    # singspree.com use them (WebAuthn related origins, singspree-be auth.js)
    location = /.well-known/webauthn {
        if ($old_domain = 0) {
            return 404;
        }
        default_type application/json;
        add_header Cache-Control "max-age=3600" always;
        return 200 '{"origins":["https://singspree.com"]}';
    }
    # The Android app (a Trusted Web Activity, built outside this repo): Chrome
    # shows the site without an address bar only while this lists the app's
    # signing keys. A missing file must be a 404, never the SPA's index.html.
    location = /.well-known/assetlinks.json {
        add_header Cache-Control "max-age=3600" always;
        try_files $uri =404;
    }

    # =====================================================================
    # Legacy URLs → permanent redirects, so search engines consolidate
    # onto the single canonical URL per page.
    # =====================================================================

    # /sing/{slug}/{songId} and /{lang}/sing/{slug}/{songId} → /sing/{songId}
    location ~ "^/(?:[a-z]{2}(?:-[A-Z]{2})?/)?sing/[^/]+/([^/]+)/?$" {
        return 301 /sing/$1$is_args$args;
    }

    # Language is no longer part of page URLs (/{lang}/sing/... → /sing/...).
    # The one exception is the home page, which exists per language so it can
    # rank for each language's searches: /{lang} → localised home (bots get the
    # prerendered one). English lives at / itself: crawlers are sent there, but
    # a person gets the app, which switches to English before it moves to / (a
    # redirect here would land them on / in whatever language they had set).
    location ~ "^/en/?$" {
        if ($is_bot) {
            return 301 /$is_args$args;
        }
        try_files /index.html =404;
    }
    # One URL each, without the trailing slash like every other page: /{lang}/
    # → /{lang}, the URL the page's canonical, its hreflang links and the
    # sitemap name. Served under both, Google listed one as "Alternate page
    # with proper canonical tag" (Oct 2026).
    location ~ "^/(de|nl|ja|ko|es|pt|fr|it|tr|zh|zh-TW|th|id|pl|ru|ar|hi|vi|sv|tl)/$" {
        return 301 /$1$is_args$args;
    }
    location ~ "^/(de|nl|ja|ko|es|pt|fr|it|tr|zh|zh-TW|th|id|pl|ru|ar|hi|vi|sv|tl)$" {
        if ($is_bot) {
            rewrite "^/([^/]+)/?$" /prerendered/$1/index.html last;
        }
        try_files /index.html =404;
    }
    location ~ "^/(?:en|de|nl|ja|ko|es|pt|fr|it|tr|zh|zh-TW|th|id|pl|ru|ar|hi|vi|sv|tl)(/.+)$" {
        return 301 $1$is_args$args;
    }

    # =====================================================================
    # SEO files (written by the backend into the shared volume)
    # =====================================================================
    # Cache-Control: no-transform here and on the crawler pages below: Cloudflare
    # then passes the response as it is (no recompression, no email
    # obfuscation), and with it nginx's ETag, which Google prefers for its
    # conditional refetches; Cloudflare dropped it from everything else.
    location = /robots.txt {
        add_header Cache-Control "no-transform" always;
        root /;
        try_files /prerendered/robots.txt /files/robots.txt =404;
    }
    location = /sitemap.xml        { add_header Cache-Control "no-transform" always; alias /prerendered/sitemap-index.xml; }
    location = /sitemap-index.xml  { add_header Cache-Control "no-transform" always; alias /prerendered/sitemap-index.xml; }
    location ~ "^/sitemap-[0-9]+\.xml$" { add_header Cache-Control "no-transform" always; root /prerendered; }

    # =====================================================================
    # Pages: bots → prerendered HTML, humans → SPA
    # =====================================================================

    # The app shell's own file is no second home page (it was served, 200,
    # without a canonical)
    location = /index.html {
        return 301 /$is_args$args;
    }

    # Home page
    location = / {
        if ($is_bot) {
            rewrite ^/$ /prerendered/index.html last;
        }
        try_files /index.html =404;
    }

    # /sing/none is the "waiting for the host" state of a party — never index
    location = /sing/none {
        add_header X-Robots-Tag "noindex" always;
        try_files /index.html =404;
    }

    # One URL per song, without the trailing slash: served under both, the
    # slashed one was a duplicate like /de/ was
    location ~ "^/sing/([^/]+)/$" {
        return 301 /sing/$1$is_args$args;
    }

    # Song pages: /sing/{songId} → /prerendered/sing/{songId}.html for bots
    location ~ "^/sing/([^/]+)$" {
        if ($is_bot) {
            rewrite "^/sing/([^/]+)$" /prerendered/sing/$1.html last;
        }
        try_files /index.html =404;
    }

    # Ephemeral party routes — never index (/j/: the QR code's short form)
    location ~ "^/(?:j|join|mic)/" {
        add_header X-Robots-Tag "noindex" always;
        try_files /index.html =404;
    }

    # Internal: a bot asked for a song page. Every song in the catalogue has
    # one generated (the indexing ramp only decides noindex and sitemap
    # membership), so a missing file means there is no such song — and song
    # IDs are case-sensitive base62, which is the usual way to arrive here.
    # Answering with the app shell would be a soft 404: 200, no content for
    # that URL, and the home page's title and description on top.
    location /prerendered/sing/ {
        internal;
        add_header Cache-Control "no-transform" always;
        root /;
        try_files $uri =404;
    }

    # Internal: the other prerendered files (language home pages). If one is
    # missing (e.g. before the first generation run), fall back to the SPA.
    location /prerendered/ {
        internal;
        add_header Cache-Control "no-transform" always;
        root /;
        try_files $uri @spa;
    }
    # The app shell. A crawler reaching here asked for something we did not
    # prerender, and the prerendered directory is exactly the set of pages we
    # publish — so that is a 404, with no list of routes to keep in step with
    # MyRouter.jsx. People get the shell and the in-app not-found page, which
    # is also what keeps a route working the day it is added.
    location @spa {
        # A crawler gets whatever was prerendered for this exact URL. The
        # frontend generates the static pages into /bot at build time and the
        # backend writes the catalogue pages into /prerendered, so between them
        # the filesystem is the list of pages we publish; nothing here has to
        # know the router's routes. No file, no page: 404.
        if ($is_bot) {
            rewrite ^(.*)$ /bot$1.html last;
        }
        try_files /index.html =404;
    }

    # Internal: reached only by that rewrite, so /bot/... is not a public URL.
    location /bot/ {
        internal;
        add_header Cache-Control "no-transform" always;
        try_files $uri =404;
    }

    # Search engines and older browsers also try /favicon.ico; a small PNG of
    # the icon answers it (the pages link /icon.svg and /icon-192.png as well)
    location = /favicon.ico {
        alias /files/icon-48.png;
        types { }
        default_type image/png;
        expires 7d;
    }

    # The party page in Rust (experimental, the account's switch in the
    # settings: src/logic/rustPartyPage.ts). It is the singspree-egui app in
    # public/rust/ with its own page for every path below it (/rust/sing/…,
    # /rust/join/…). Only the song pages' hand-over leads here, and nothing
    # here is for search engines. ^~: the song and language patterns above
    # must not take these paths.
    location ^~ /rust/ {
        add_header X-Robots-Tag "noindex" always;
        try_files $uri /rust/index.html;
    }

    # =====================================================================
    # Default: static assets + SPA fallback for every other route
    # =====================================================================
    location / {
        index index.html;
        try_files $uri @spa;
    }
}
